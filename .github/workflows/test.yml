name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: bondhon_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, dom, fileinfo, mysql, gd

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Copy .env
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=bondhon_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=password" >> .env

      - name: Generate application key
        working-directory: ./backend
        run: php artisan key:generate

      - name: Run database migrations
        working-directory: ./backend
        run: php artisan migrate --force

      - name: Run Backend Tests
        working-directory: ./backend
        run: php artisan test

      - name: 🏥 Backend Health Check
        working-directory: ./backend
        run: |
          echo "🚀 Starting Laravel server..."
          php artisan serve --host=127.0.0.1 --port=8000 &
          SERVER_PID=$!

          echo "⏳ Waiting for server to start..."
          sleep 10

          echo "🔍 Testing Laravel health..."
          # Test basic Laravel response
          if curl -f http://127.0.0.1:8000 > /dev/null 2>&1; then
            echo "✅ Laravel server is responding!"
          else
            echo "❌ Laravel server is not responding!"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "🗄️ Testing database connection..."
          if php artisan tinker --execute="DB::connection()->getPdo(); echo 'Database connected!';" | grep -q "Database connected"; then
            echo "✅ Database connection successful!"
          else
            echo "❌ Database connection failed!"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          echo "🛑 Stopping test server..."
          kill $SERVER_PID 2>/dev/null || true

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run Frontend Linting
        working-directory: ./frontend
        run: npm run lint

      - name: 🏥 Frontend Health Check
        working-directory: ./frontend
        run: |
          echo "🚀 Starting Next.js server..."
          npm run start &
          FRONTEND_PID=$!

          echo "⏳ Waiting for Next.js to start..."
          sleep 15

          echo "🔍 Testing Next.js health..."
          # Test that Next.js serves the homepage
          if curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "✅ Next.js server is responding!"
          else
            echo "❌ Next.js server is not responding!"
            kill $FRONTEND_PID 2>/dev/null || true
            exit 1
          fi

          # Test that build was successful
          if [ -d ".next" ]; then
            echo "✅ Next.js build artifacts found!"
          else
            echo "❌ Next.js build artifacts missing!"
            kill $FRONTEND_PID 2>/dev/null || true
            exit 1
          fi

          echo "🛑 Stopping test server..."
          kill $FRONTEND_PID 2>/dev/null || true
