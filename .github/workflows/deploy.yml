name: 🚀 Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  deployments: write
  contents: read
  actions: read

jobs:
  deploy:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🚀 Create Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          result-encoding: string
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Auto-deployment to Bondhon production server',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            echo "🚀 Starting deployment to Bondhon Production Server..."

            # Navigate to project directory
            cd /var/www/bondhon
            
            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            # Create backend .env from GitHub Secret
            echo "⚙️ Updating backend environment..."
            cd backend
            cat > .env << 'EOF'
          ${{ secrets.BACKEND_ENV }}
          EOF
            
            # Backend deployment with production optimization
            echo "📦 Installing backend dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Laravel optimization
            echo "🧹 Optimizing Laravel application..."
            php artisan config:clear
            php artisan config:cache
            php artisan route:clear
            php artisan route:cache
            php artisan view:clear
            php artisan view:cache
            php artisan optimize
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            php artisan migrate --force --no-interaction
            
            # Create frontend .env.local from GitHub Secret
            echo "⚙️ Updating frontend environment..."
            cd ../frontend
            cat > .env.local << 'EOF'
          ${{ secrets.FRONTEND_ENV }}
          EOF
            
            # Frontend deployment
            echo "🏗️ Building frontend assets..."
            npm ci --production=false
            npm run build
            
            # Fix file permissions (CRITICAL!)
            echo "🔐 Setting proper file permissions..."
            chown -R www-data:www-data /var/www/bondhon/backend/storage
            chown -R www-data:www-data /var/www/bondhon/backend/bootstrap/cache
            chmod -R 755 /var/www/bondhon/backend/storage
            chmod -R 755 /var/www/bondhon/backend/bootstrap/cache
            
            # Restart services properly
            echo "🔄 Restarting web services..."
            systemctl restart nginx
            systemctl restart php8.2-fpm
            
            # Restart PM2 if exists
            if command -v pm2 &> /dev/null; then
                pm2 restart all || true
            fi
            
                      # Comprehensive Health Checks
          echo "🏥 Running comprehensive health checks..."
          sleep 10

          # Check service status
          echo "🔍 Checking service status..."
          if ! systemctl is-active --quiet nginx; then
              echo "❌ nginx is not running!"
              exit 1
          fi

          if ! systemctl is-active --quiet php8.2-fpm; then
              echo "❌ PHP-FPM is not running!"
              exit 1
          fi

          echo "✅ All services are running!"

          # Test Laravel application health
          echo "🔍 Testing Laravel application..."
          cd /var/www/bondhon/backend

          # Test Laravel can start
          if ! php artisan --version > /dev/null 2>&1; then
              echo "❌ Laravel artisan command failed!"
              exit 1
          fi

          # Test database connection
          if ! php artisan tinker --execute="DB::connection()->getPdo(); echo 'DB_OK';" 2>/dev/null | grep -q "DB_OK"; then
              echo "❌ Laravel database connection failed!"
              exit 1
          fi

          # Test Laravel via nginx (real world test)
          if ! curl -f -s http://localhost > /dev/null; then
              echo "❌ nginx → Laravel connection failed!"
              
              # Additional debugging
              echo "🔍 Debugging nginx/Laravel connection..."
              echo "nginx error logs:"
              tail -5 /var/log/nginx/error.log 2>/dev/null || echo "No nginx error logs"
              echo "Laravel logs:"
              tail -5 /var/www/bondhon/backend/storage/logs/laravel.log 2>/dev/null || echo "No Laravel logs"
              exit 1
          fi

          echo "✅ Laravel is responding through nginx!"

          # Test frontend build exists
          echo "🔍 Testing frontend build..."
          if [ ! -d "/var/www/bondhon/frontend/.next" ]; then
              echo "❌ Frontend build artifacts missing!"
              exit 1
          fi

          echo "✅ Frontend build artifacts found!"

          # Test if Laravel API endpoints work
          echo "🔍 Testing Laravel API endpoints..."
          if curl -f -s http://localhost/api > /dev/null; then
              echo "✅ Laravel API is accessible!"
          else
              echo "⚠️ Laravel API may have issues (this might be expected if no /api route exists)"
          fi

          echo "✅ All health checks passed!"
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Bondhon is now live at: http://159.223.60.129"
          ENDSSH

      - name: ✅ Mark Deployment Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'success',
              environment: 'production',
              environment_url: 'http://159.223.60.129',
              description: 'Bondhon deployment completed successfully!'
            });

      - name: ❌ Mark Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'failure',
              environment: 'production',
              description: 'Bondhon deployment failed. Check workflow logs for details.'
            });

      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Bondhon Deployment SUCCESSFUL! 🎉"
            echo "🌐 Live at: http://159.223.60.129"
          else
            echo "❌ Bondhon Deployment FAILED! 😞"
            echo "Please check the logs above for details."
          fi
