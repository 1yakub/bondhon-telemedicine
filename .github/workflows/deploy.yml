name: 🚀 Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  deployments: write
  contents: read
  actions: read

jobs:
  deploy:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🚀 Create Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          result-encoding: string
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Auto-deployment to Bondhon production server',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Production Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            echo "🚀 Starting deployment to Bondhon Production Server..."

            # Navigate to project directory
            cd /var/www/bondhon

            # Fix git ownership issue
            echo "🔐 Fixing git ownership permissions..."
            git config --global --add safe.directory /var/www/bondhon

            # Handle any local changes (prevent merge conflicts)
            echo "📝 Handling local changes..."
            git add . 2>/dev/null || true
            git commit -m "Auto-save local changes before deployment" 2>/dev/null || true

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Create backend environment file from secret
            echo "🔧 Setting up backend environment..."
            cd backend
            cat > .env << 'ENV_EOF'
${{ secrets.BACKEND_ENV }}
ENV_EOF
            
            # Backend deployment
            echo "📦 Installing backend dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Laravel optimization
            echo "🧹 Optimizing Laravel application..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force --no-interaction

            # Create frontend environment file from secret
            echo "🔧 Setting up frontend environment..."
            cd ../frontend
            cat > .env.local << 'FRONTEND_ENV_EOF'
${{ secrets.FRONTEND_ENV }}
FRONTEND_ENV_EOF
            
            # Frontend deployment
            echo "🏗️ Building frontend assets..."
            npm ci
            npm run build
            
            # Fix file permissions
            echo "🔐 Setting proper file permissions..."
            chown -R www-data:www-data /var/www/bondhon/backend/storage
            chown -R www-data:www-data /var/www/bondhon/backend/bootstrap/cache
            chmod -R 755 /var/www/bondhon/backend/storage
            chmod -R 755 /var/www/bondhon/backend/bootstrap/cache
            
            # Restart services
            echo "🔄 Restarting web services..."
            systemctl restart nginx
            systemctl restart php8.2-fpm
            
            # Basic health check
            echo "🏥 Checking services..."
            if systemctl is-active --quiet nginx && systemctl is-active --quiet php8.2-fpm; then
                echo "✅ All services are running!"
            else
                echo "⚠️ Some services may have issues"
                exit 1
            fi

            echo "🎉 Deployment completed successfully!"
            echo "🌐 Bondhon is live at: http://159.223.60.129"
          ENDSSH

      - name: ✅ Mark Deployment Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'success',
              environment: 'production',
              environment_url: 'http://159.223.60.129',
              description: 'Bondhon deployment completed successfully!'
            });

      - name: ❌ Mark Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'failure',
              environment: 'production',
              description: 'Bondhon deployment failed. Check workflow logs for details.'
            });

      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Bondhon Deployment SUCCESSFUL! 🎉"
            echo "🌐 Live at: http://159.223.60.129"
          else
            echo "❌ Bondhon Deployment FAILED! 😞"
            echo "Please check the logs above for details."
          fi
