name: 🚀 Deploy to DigitalOcean

on:
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

permissions:
  deployments: write
  contents: read
  actions: read

jobs:
  deploy:
    name: 🌐 Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 🚀 Create Deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          result-encoding: string
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Auto-deployment to Bondhon production server',
              auto_merge: false,
              required_contexts: []
            });
            return deployment.data.id;

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Production Server
        env:
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV_CONTENT: ${{ secrets.FRONTEND_ENV }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            echo "🚀 Starting deployment to Bondhon Production Server..."

            # Navigate to project directory
            cd /var/www/bondhon

            # Fix git ownership issue
            echo "🔐 Fixing git ownership permissions..."
            git config --global --add safe.directory /var/www/bondhon

            # Handle any local changes (prevent merge conflicts)
            echo "📝 Handling local changes..."
            git add . 2>/dev/null || true
            git commit -m "Auto-save local changes before deployment" 2>/dev/null || true

            # Pull latest changes
            echo "📥 Pulling latest changes..."
            git pull origin main

            # Create backend environment file from secret
            echo "🔧 Setting up backend environment..."
            cd backend
            cat > .env << 'BACKEND_ENV_END'
          ENDSSH
          
          # Write backend environment content
          echo "$BACKEND_ENV_CONTENT" | ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} 'cat >> /var/www/bondhon/backend/.env'
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            cd /var/www/bondhon/backend
            
            # Backend deployment
            echo "📦 Installing backend dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Clear any existing config cache BEFORE setting up environment
            echo "🧹 Clearing existing Laravel caches..."
            php artisan config:clear || true
            php artisan cache:clear || true
            php artisan route:clear || true
            php artisan view:clear || true

            # Create frontend environment file from secret
            echo "🔧 Setting up frontend environment..."
            cd ../frontend
          ENDSSH
          
          # Write frontend environment content
          echo "$FRONTEND_ENV_CONTENT" | ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} 'cat > /var/www/bondhon/frontend/.env.local'
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            cd /var/www/bondhon/backend
            
            # Laravel optimization AFTER environment is set
            echo "🧹 Optimizing Laravel application with new environment..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force --no-interaction

            # Verify environment is loaded correctly
            echo "🔍 Verifying environment configuration..."
            php artisan tinker --execute="echo 'APP_ENV: ' . env('APP_ENV') . PHP_EOL; echo 'APP_DEBUG: ' . (env('APP_DEBUG') ? 'true' : 'false') . PHP_EOL;"

            # Frontend deployment
            echo "🔧 Setting up frontend environment..."
            cd ../frontend
          ENDSSH
          
          # Write frontend environment content
          echo "$FRONTEND_ENV_CONTENT" | ssh ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} 'cat > /var/www/bondhon/frontend/.env.local'
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            cd /var/www/bondhon/frontend
            
            # Frontend deployment
            echo "🏗️ Building frontend assets..."
            npm ci
            npm run build
            
            # Restart frontend service
            echo "🔄 Restarting frontend service..."
            pkill -f "next" || true
            nohup npm start > /dev/null 2>&1 &
            sleep 3
            
            # Fix file permissions
            echo "🔐 Setting proper file permissions..."
            chown -R www-data:www-data /var/www/bondhon/backend/storage
            chown -R www-data:www-data /var/www/bondhon/backend/bootstrap/cache
            chmod -R 755 /var/www/bondhon/backend/storage
            chmod -R 755 /var/www/bondhon/backend/bootstrap/cache
            
            # Restart services
            echo "🔄 Restarting web services..."
            systemctl restart nginx
            systemctl restart php8.2-fpm
            
            # Basic health check
            echo "🏥 Checking services..."
            if systemctl is-active --quiet nginx && systemctl is-active --quiet php8.2-fpm; then
                echo "✅ All services are running!"
            else
                echo "⚠️ Some services may have issues"
                exit 1
            fi

            echo "🎉 Deployment completed successfully!"
            echo "🌐 Bondhon is live at: http://159.223.60.129"
          ENDSSH

      - name: ✅ Mark Deployment Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'success',
              environment: 'production',
              environment_url: 'http://159.223.60.129',
              description: 'Bondhon deployment completed successfully!'
            });

      - name: ❌ Mark Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.result }}',
              state: 'failure',
              environment: 'production',
              description: 'Bondhon deployment failed. Check workflow logs for details.'
            });

      - name: 📊 Deployment Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Bondhon Deployment SUCCESSFUL! 🎉"
            echo "🌐 Live at: http://159.223.60.129"
          else
            echo "❌ Bondhon Deployment FAILED! 😞"
            echo "Please check the logs above for details."
          fi
